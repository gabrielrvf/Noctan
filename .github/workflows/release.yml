name: Publish Noctan update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        run: npm version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version" "$env:GITHUB_SHA"
          git push origin "v$version"

      - name: Build desktop artifacts
        run: npx electron-builder --win nsis --publish never

      - name: Create release and upload desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "Noctan v$version" --notes "Automated Noctan release."
          }
          gh release upload $tag "dist/Noctan-Setup-$version.exe" "dist/Noctan-Setup-$version.exe.blockmap" "dist/latest.yml" --clobber

  mobile:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build generic Android APK
        shell: pwsh
        run: |
          cd mobile/android
          ./gradlew.bat :app:assembleRelease
          Copy-Item app/build/outputs/apk/release/app-release.apk ../../Noctan-Mobile.apk

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "v1.0.${{ github.run_number }}" Noctan-Mobile.apk --clobber
