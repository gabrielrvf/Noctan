name: Publish Noctan update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noctan-release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        run: npm version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      - name: Build desktop artifacts
        run: npx electron-builder --win nsis --publish never

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build matching Android APK
        shell: pwsh
        run: |
          $env:NOCTAN_RELEASE_VERSION = node -p "require('./package.json').version"
          $env:NOCTAN_RELEASE_CODE = "${{ github.run_number }}"
          cd mobile/android
          ./gradlew.bat :app:assembleRelease
          Copy-Item app/build/outputs/apk/release/app-release.apk ../../Noctan-Mobile.apk

      - name: Publish desktop and Android atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --draft --title "Noctan v$version" --notes "Desktop e Android publicados juntos."
          }
          gh release upload $tag "dist/Noctan-Setup-$version.exe" "dist/Noctan-Setup-$version.exe.blockmap" "dist/latest.yml" "Noctan-Mobile.apk" --clobber
          gh release edit $tag --draft=false --latest
