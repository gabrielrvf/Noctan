name: Publish Noctan update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noctan-release-main
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        run: npm version --allow-same-version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      - name: Build desktop artifacts
        run: npm run dist:win -- --publish never

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android signing key
        shell: pwsh
        env:
          NOCTAN_ANDROID_DEBUG_KEYSTORE: ${{ secrets.NOCTAN_ANDROID_DEBUG_KEYSTORE }}
        run: |
          New-Item -ItemType Directory -Force "$HOME/.android" | Out-Null
          [IO.File]::WriteAllBytes("$HOME/.android/debug.keystore", [Convert]::FromBase64String($env:NOCTAN_ANDROID_DEBUG_KEYSTORE))

      - name: Build matching Android APK
        shell: pwsh
        run: |
          $env:NOCTAN_RELEASE_VERSION = node -p "require('./package.json').version"
          $env:NOCTAN_RELEASE_CODE = "${{ github.run_number }}"
          cd mobile/android
          ./gradlew.bat :app:assembleRelease
          Copy-Item app/build/outputs/apk/release/app-release.apk ../../Noctan-Mobile.apk

      - name: Upload Windows and Android to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --draft --title "Noctan v$version" --notes "Desktop (Windows e macOS) e Android publicados juntos."
          }
          gh release upload $tag "dist/Noctan-Setup-$version.exe" "dist/Noctan-Setup-$version.exe.blockmap" "dist/latest.yml" "Noctan-Mobile.apk" --clobber

  mac:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: npm version --allow-same-version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      # With the Developer ID secrets: signed, notarized and auto-updatable (latest-mac.yml).
      # Without them: ad-hoc build, no notarization, no auto-update.
      - name: Build macOS artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
            npm run dist:mac -- --arm64 --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
            rm -f dist/latest-mac.yml
          fi

      - name: Keep macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noctan-mac
          path: |
            dist/Noctan-*-mac-arm64.dmg
            dist/Noctan-*-mac-arm64.zip
            dist/Noctan-*-mac-arm64.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  publish:
    needs: [release, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: noctan-mac
          path: mac

      - name: Publish Windows, macOS and Android atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release upload "$tag" mac/* --clobber
          gh release edit "$tag" --draft=false --latest
