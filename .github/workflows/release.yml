name: Publish Noctan update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noctan-release-main
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        run: npm version --allow-same-version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      - name: Build desktop artifacts
        run: npx electron-builder --win nsis --publish never

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android signing key
        shell: pwsh
        env:
          NOCTAN_ANDROID_DEBUG_KEYSTORE: ${{ secrets.NOCTAN_ANDROID_DEBUG_KEYSTORE }}
        run: |
          New-Item -ItemType Directory -Force "$HOME/.android" | Out-Null
          [IO.File]::WriteAllBytes("$HOME/.android/debug.keystore", [Convert]::FromBase64String($env:NOCTAN_ANDROID_DEBUG_KEYSTORE))

      - name: Build matching Android APK
        shell: pwsh
        run: |
          $env:NOCTAN_RELEASE_VERSION = node -p "require('./package.json').version"
          $env:NOCTAN_RELEASE_CODE = "${{ github.run_number }}"
          cd mobile/android
          ./gradlew.bat :app:assembleRelease
          Copy-Item app/build/outputs/apk/release/app-release.apk ../../Noctan-Mobile.apk

      - name: Upload Windows and Android to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --draft --title "Noctan v$version" --notes "Desktop (Windows e macOS) e Android publicados juntos."
          }
          gh release upload $tag "dist/Noctan-Setup-$version.exe" "dist/Noctan-Setup-$version.exe.blockmap" "dist/latest.yml" "Noctan-Mobile.apk" --clobber

  mac:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: npm version --allow-same-version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Tests
        run: npm run check

      # Ad-hoc signed (mac.identity "-"); no Developer ID, so no latest-mac.yml/auto-update.
      - name: Build macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Keep macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noctan-mac
          path: |
            dist/Noctan-*-mac-arm64.dmg
            dist/Noctan-*-mac-arm64.zip
          if-no-files-found: error

  publish:
    needs: [release, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: noctan-mac
          path: mac

      - name: Publish Windows, macOS and Android atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release upload "$tag" mac/* --clobber
          gh release edit "$tag" --draft=false --latest
