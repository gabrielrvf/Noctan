<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noctan Mobile</title>
<style>
:root{color-scheme:dark;--bg:#111;--panel:#181818;--panel2:#222;--border:#363636;--text:#f2f2f2;--muted:#aaa;--accent:#d6a93b;--violet:#8a69b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}button{border:1px solid var(--border);background:#202020;border-radius:12px;padding:10px 12px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:#141414;position:sticky;top:0;z-index:4}
.logo{width:28px;height:28px;border-radius:8px}.title{font-weight:700;min-width:0;flex:1}.status{font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#666;display:inline-block;margin-right:5px}.dot.on{background:#4fd48a}.dot.bad{background:#e36060}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #252525;overflow:auto}.toolbar select{background:#1c1c1c;border:1px solid var(--border);border-radius:10px;padding:8px;max-width:52vw}
#chat{flex:1;overflow:auto;padding:14px 12px 130px;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:11px 13px;border-radius:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#2c2c2c}.msg.assistant{align-self:flex-start;background:#171717;border:1px solid #303030}.msg.system{align-self:center;background:#251d16;color:#d9b889;font-size:12px}.files{font-size:12px;color:#bbb;margin-top:8px}.progress{align-self:stretch;border:1px solid #3c3148;background:#201c25;color:#d9c2f2;border-radius:12px;padding:9px 11px;font-size:12px}.approval{align-self:stretch;border:1px solid #8a6327;background:#2b2114;border-radius:14px;padding:12px}.approval pre{white-space:pre-wrap;max-height:160px;overflow:auto;font-size:11px}.approval .actions{display:flex;gap:8px;flex-wrap:wrap}.approval .allowAll{background:#523d16;border-color:#a97d29}
#composer{position:fixed;left:0;right:0;bottom:0;padding:9px 10px max(9px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#111 14px);z-index:5}.composeBox{background:#1d1d1d;border:1px solid #363636;border-radius:18px;padding:8px}.pending{display:flex;gap:7px;overflow:auto}.att{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:9px;border:1px solid #444;background:#252525;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden}.att img{width:100%;height:100%;object-fit:cover}.att .x{position:absolute;right:1px;top:1px;padding:0;width:20px;height:20px;border-radius:50%;background:#111c}.row{display:flex;align-items:flex-end;gap:7px}textarea{flex:1;resize:none;max-height:130px;min-height:46px;border:0;outline:0;background:transparent;padding:10px;font-size:16px}.circle{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:18px}.send{background:var(--accent);color:#1a1407;border:0;font-size:22px}.stop{border-color:#744;color:#fbb}.hidden{display:none!important}
dialog{width:min(94vw,700px);border:1px solid #444;border-radius:16px;background:#161616;color:#fff;padding:14px}dialog::backdrop{background:#000b}.settings label{display:block;font-size:12px;color:#aaa;margin:10px 0 4px}.settings input,.settings select{width:100%;padding:11px;border-radius:10px;border:1px solid #444;background:#202020}.settings .actions{display:flex;gap:8px;margin-top:14px}.settings .actions button{flex:1}.preview img{max-width:100%;max-height:75vh;display:block;margin:auto}.preview .close{float:right}.empty{color:#777;text-align:center;padding:40px 15px}
</style>
</head>
<body>
<header>
<img class="logo" src="file:///android_res/drawable/noctan_mark.png" alt="">
<div class="title">Noctan <span style="font-weight:400;color:#888">Mobile</span><div class="status"><span id="onlineDot" class="dot"></span><span id="statusText">Conectando…</span></div></div>
<button id="settingsBtn" aria-label="Configurações">⚙</button>
</header>

<div class="toolbar">
<select id="sessionSelect"><option>Carregando conversas…</option></select>
<select id="modelSelect"><option value="opus">Opus</option><option value="fable">Fable</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
<select id="effortSelect"><option value="low">Baixo</option><option value="medium">Médio</option><option value="high">Alto</option></select>
<button id="stopBtn" class="stop hidden">Parar</button>
</div>

<main id="chat"><div class="empty">Conectando ao Noctan do PC…</div></main>

<div id="composer">
<div class="composeBox">
<div id="pending" class="pending"></div>
<div class="row">
<button id="attachBtn" class="circle" aria-label="Anexar">＋</button>
<button id="voiceBtn" class="circle" aria-label="Falar">🎙</button>
<textarea id="prompt" placeholder="Mensagem para o Noctan…" rows="1"></textarea>
<button id="sendBtn" class="circle send" aria-label="Enviar">↑</button>
</div>
</div>
<input id="fileInput" type="file" multiple hidden>
</div>

<dialog id="settingsDialog" class="settings">
<h3>Conectar ao PC</h3>
<label>Endereço do Noctan</label><input id="baseInput" autocapitalize="off" spellcheck="false">
<label>Token de pairing</label><input id="tokenInput" autocapitalize="off" spellcheck="false">
<div class="actions"><button id="closeSettings">Cancelar</button><button id="saveSettings">Salvar e conectar</button></div>
</dialog>

<dialog id="previewDialog" class="preview"><button id="closePreview" class="close">×</button><img id="previewImage" alt="Prévia"></dialog>

<script>
const DEFAULT_BASE=(window.NoctanNative&&window.NoctanNative.getDefaultBase)?window.NoctanNative.getDefaultBase():"";
const DEFAULT_TOKEN=(window.NoctanNative&&window.NoctanNative.getDefaultToken)?window.NoctanNative.getDefaultToken():"";
const state={base:localStorage.getItem("base")||DEFAULT_BASE,token:localStorage.getItem("token")||DEFAULT_TOKEN,current:null,session:null,config:null,pending:[],streaming:false,assistant:null,progress:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function authHeaders(extra={}){return {Authorization:"Bearer "+state.token,...extra}}
async function api(path,opt={}){const res=await fetch(state.base+path,{...opt,headers:authHeaders({"content-type":"application/json",...(opt.headers||{})})});if(!res.ok){let j={};try{j=await res.json()}catch{}throw Error(j.error||("HTTP "+res.status))}return res}
function setStatus(ok,text){$("onlineDot").className="dot "+(ok?"on":"bad");$("statusText").textContent=text}
function addMsg(role,text,attachments=[]){const el=document.createElement("div");el.className="msg "+role;el.textContent=text||"";if(attachments?.length){const f=document.createElement("div");f.className="files";f.textContent="📎 "+attachments.join(", ");el.append(f)}$("chat").append(el);$("chat").scrollTop=$("chat").scrollHeight;return el}
function renderSession(s){state.session=s;state.current=s?.id||state.current;$("chat").replaceChildren();state.assistant=null;state.progress=null;if(!s?.messages?.length){$("chat").innerHTML='<div class="empty">Conversa vazia</div>'}else for(const m of s.messages)addMsg(m.role,m.text,m.attachments||[]);const active=!!s?.inFlight;$("stopBtn").classList.toggle("hidden",!active);$("chat").scrollTop=$("chat").scrollHeight}
async function loadSessions(keep=true){const list=await (await api("/api/sessions")).json();const sel=$("sessionSelect");const previous=state.current;sel.replaceChildren();const fresh=document.createElement("option");fresh.value="";fresh.textContent="＋ Nova conversa";sel.append(fresh);for(const s of list){const o=document.createElement("option");o.value=s.id;o.textContent=(s.inFlight?"● ":"")+(s.title||"Conversa");sel.append(o)}if(keep&&previous&&list.some(x=>x.id===previous))state.current=previous;else if(!state.current&&list.length)state.current=list[0].id;sel.value=state.current||"";if(state.current){const s=await (await api("/api/sessions/"+encodeURIComponent(state.current))).json();renderSession(s)}else renderSession({id:null,messages:[]})}
async function refreshStatus(){try{const st=await (await api("/api/status")).json();state.config=st.config;$("modelSelect").value=st.config.anthropicModel||st.config.model||"sonnet";$("effortSelect").value=st.config.effort||"medium";const pc=st.discovery?.pcController;setStatus(true,pc?.localConnected?"PC online · "+(pc.localToolCount||0)+" ferramentas":"Noctan online");}catch(e){setStatus(false,"Offline · "+e.message)}}
async function saveConfig(){if(!state.config)return;state.config={...state.config,anthropicModel:$("modelSelect").value,model:$("modelSelect").value,effort:$("effortSelect").value};await api("/api/config",{method:"PUT",body:JSON.stringify(state.config)})}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,dataUrl:r.result});r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function addFiles(files){for(const f of [...files].slice(0,5-state.pending.length)){if(f.size>20000000){addMsg("system",f.name+" é maior que 20 MB");continue}state.pending.push(await fileToDataUrl(f))}renderPending()}
function renderPending(){$("pending").replaceChildren();state.pending.forEach((a,i)=>{const d=document.createElement("div");d.className="att";if(a.type.startsWith("image/")){const img=document.createElement("img");img.src=a.dataUrl;img.onclick=()=>{$("previewImage").src=a.dataUrl;$("previewDialog").showModal()};d.append(img)}else{d.textContent="📄 "+(a.name.split(".").pop()||"FILE").toUpperCase()}const x=document.createElement("button");x.className="x";x.textContent="×";x.onclick=e=>{e.stopPropagation();state.pending.splice(i,1);renderPending()};d.append(x);$("pending").append(d)})}
function approvalCard(data){const d=document.createElement("div");d.className="approval";d.innerHTML="<b>Permissão solicitada: "+esc(data.tool)+"</b><pre>"+esc(JSON.stringify(data.input,null,2))+"</pre><div class=actions></div>";const actions=d.querySelector(".actions");for(const [label,allow,all] of [["Permitir",true,false],["Permitir tudo",true,true],["Negar",false,false]]){const b=document.createElement("button");b.textContent=label;if(all)b.className="allowAll";b.onclick=async()=>{try{await api("/api/approve",{method:"POST",body:JSON.stringify({id:data.id,allow,allowAll:all})});d.remove()}catch(e){addMsg("system",e.message)}};actions.append(b)}$("chat").append(d);$("chat").scrollTop=$("chat").scrollHeight}
function progress(text){if(!state.progress||!state.progress.isConnected){state.progress=document.createElement("div");state.progress.className="progress";$("chat").append(state.progress)}state.progress.textContent=text;$("chat").scrollTop=$("chat").scrollHeight}
function parsePacket(packet){let event="",data="";for(const line of packet.split(/\r?\n/)){if(line.startsWith("event:"))event=line.slice(6).trim();else if(line.startsWith("data:"))data+=line.slice(5).trim()}if(!event)return;let obj={};try{obj=JSON.parse(data||"{}")}catch{}if(event==="start"){state.current=obj.sessionId;$("sessionSelect").value=state.current;state.streaming=true;$("stopBtn").classList.remove("hidden");progress("Executando…")}else if(event==="text"){if(!state.assistant)state.assistant=addMsg("assistant","");state.assistant.firstChild?state.assistant.firstChild.nodeValue+=obj.text:state.assistant.append(document.createTextNode(obj.text));$("chat").scrollTop=$("chat").scrollHeight}else if(event==="tool"){progress("Usando ferramenta: "+obj.name)}else if(event==="approval"){approvalCard(obj);progress("Aguardando autorização…")}else if(event==="notice"){progress(obj.text||"Atualização")}else if(event==="error"){addMsg("system","Erro: "+(obj.error||"desconhecido"))}else if(event==="done"){state.streaming=false;$("stopBtn").classList.add("hidden");state.progress?.remove();state.progress=null;state.assistant=null;loadSessions(true).catch(()=>{})}}
async function streamRun(body){state.streaming=true;state.assistant=null;progress("Iniciando…");const res=await fetch(state.base+"/api/run",{method:"POST",headers:authHeaders({"content-type":"application/json"}),body:JSON.stringify(body)});if(!res.ok){const j=await res.json().catch(()=>({}));throw Error(j.error||"Falha ao iniciar")}const reader=res.body.getReader(),dec=new TextDecoder();let buf="";while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf("\n\n"))>=0){parsePacket(buf.slice(0,i));buf=buf.slice(i+2)}}}
async function send(){const prompt=$("prompt").value.trim(),attachments=[...state.pending];if(!prompt&&!attachments.length)return;$("prompt").value="";state.pending=[];renderPending();addMsg("user",prompt||"Arquivo anexado",attachments.map(x=>x.name));state.assistant=null;const active=!!state.session?.inFlight||state.streaming;if(active&&state.current){await api("/api/follow-up",{method:"POST",body:JSON.stringify({sessionId:state.current,prompt,attachments})});progress(attachments.length?"Follow-up com anexo enviado":"Follow-up enviado");return}
const nonImage=attachments.some(x=>!x.type.startsWith("image/"));if(nonImage){let bootstrapSession=null;const res=await fetch(state.base+"/api/run",{method:"POST",headers:authHeaders({"content-type":"application/json"}),body:JSON.stringify({prompt:"Aguarde o próximo follow-up com os arquivos anexados e então execute a solicitação.",sessionId:state.current||null,provider:"anthropic",attachments:[]})});if(!res.ok)throw Error("Falha ao iniciar sessão");const reader=res.body.getReader(),dec=new TextDecoder();let buf="";let sent=false;state.streaming=true;while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf("\n\n"))>=0){const packet=buf.slice(0,i);buf=buf.slice(i+2);let ev="",dat="";for(const line of packet.split(/\r?\n/)){if(line.startsWith("event:"))ev=line.slice(6).trim();else if(line.startsWith("data:"))dat+=line.slice(5).trim()}let o={};try{o=JSON.parse(dat)}catch{}if(ev==="start"&&!sent){bootstrapSession=o.sessionId;state.current=bootstrapSession;sent=true;await api("/api/follow-up",{method:"POST",body:JSON.stringify({sessionId:bootstrapSession,prompt,attachments})})}parsePacket(packet)}}return}
await streamRun({prompt,sessionId:state.current||null,provider:"anthropic",attachments})}
$("sendBtn").onclick=()=>send().catch(e=>addMsg("system",e.message));$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send().catch(x=>addMsg("system",x.message))}});$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{addFiles(e.target.files).catch(x=>addMsg("system",x.message));e.target.value=""};$("voiceBtn").onclick=()=>{if(window.NoctanNative)window.NoctanNative.startVoice()};window.NoctanVoiceResult=text=>{const p=$("prompt");p.value=(p.value+" "+text).trim();p.focus()};window.NoctanVoiceError=msg=>addMsg("system",msg);
$("stopBtn").onclick=async()=>{if(!state.current)return;try{await api("/api/cancel",{method:"POST",body:JSON.stringify({sessionId:state.current})});progress("Parando…")}catch(e){addMsg("system",e.message)}};$("sessionSelect").onchange=async e=>{state.current=e.target.value||null;state.session=null;if(state.current){renderSession(await (await api("/api/sessions/"+encodeURIComponent(state.current))).json())}else renderSession({id:null,messages:[]})};
$("modelSelect").onchange=()=>saveConfig().catch(e=>addMsg("system",e.message));$("effortSelect").onchange=()=>saveConfig().catch(e=>addMsg("system",e.message));
$("settingsBtn").onclick=()=>{$("baseInput").value=state.base;$("tokenInput").value=state.token;$("settingsDialog").showModal()};$("closeSettings").onclick=()=>$("settingsDialog").close();$("saveSettings").onclick=()=>{state.base=$("baseInput").value.trim().replace(/\/$/,"");state.token=$("tokenInput").value.trim();localStorage.setItem("base",state.base);localStorage.setItem("token",state.token);$("settingsDialog").close();boot()};$("closePreview").onclick=()=>$("previewDialog").close();$("previewDialog").onclick=e=>{if(e.target===$("previewDialog"))$("previewDialog").close()};
async function boot(){setStatus(false,"Conectando…");try{await refreshStatus();await loadSessions(false)}catch(e){setStatus(false,"Falha: "+e.message);$("chat").innerHTML='<div class="empty">Não foi possível conectar ao PC.<br><br>Abra ⚙ e confira o endereço/token.</div>'}}
boot();setInterval(()=>{refreshStatus().catch(()=>{});if(!state.streaming&&state.current)loadSessions(true).catch(()=>{})},4000);
</script>
</body>
</html>
