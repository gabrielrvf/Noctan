<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noctan</title>
<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.layout{height:100%;display:flex;background:#151515}

.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}.brand .logo{width:30px;height:30px}.brand img{width:100%;height:100%;object-fit:contain}.brand strong{display:block;font-size:15px;letter-spacing:.4px}.brand small{display:block;color:#7f7f7f;font-size:10px;letter-spacing:1.5px}
.search{width:100%;border:1px solid #333;border-radius:7px;background:#171717;color:#ddd;padding:9px 11px;outline:none}.newButton{width:100%;padding:9px 11px;border:1px solid #333;border-radius:7px;background:#1b1b1b;color:#ddd;font-weight:600}.section{font-size:10px;color:#666;margin:15px 8px 3px}.sessions{display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1}.sessionRow{width:100%;border:0;border-radius:8px;background:transparent;color:#aaa;padding:9px 10px;text-align:left;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sessionRow.active{background:#1d1d1d;color:#fff}.sessionRow .runDot{color:#d6a93b;margin-right:5px}
.sidebarbottom{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;border-top:1px solid #272727;padding:12px 5px 2px}.profileDot{width:28px;height:28px;border-radius:50%;background:#222;display:grid;place-items:center;color:#d6a93b}.profileCopy strong{display:block;font-size:12px}.profileCopy small{color:#777;font-size:10px}.connection{grid-column:1/-1;font-size:11px;color:#a7a7a7}

.chat{flex:1;overflow:auto;padding:18px 14px 160px;display:flex;flex-direction:column;gap:18px}.welcome{margin:auto;text-align:center;color:#858585}.welcome img{width:64px;height:64px}.welcome h2{color:#ededed;font-size:22px;margin:10px 0}.welcome p{font-size:12px}
.pullRefresh{position:fixed;z-index:12;top:70px;left:50%;transform:translate(-50%,-48px);opacity:0;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #343434;border-radius:18px;background:#1b1b1b;color:#aaa;font-size:11px;transition:transform .16s ease,opacity .16s ease}.pullRefresh.show{transform:translate(-50%,0);opacity:1}.pullRefresh img{width:17px;height:17px;object-fit:contain}.pullRefresh.loading img{animation:pullSpin 1s linear infinite}@keyframes pullSpin{to{transform:rotate(360deg)}}
.message{max-width:92%;padding:14px 17px;border-radius:14px;overflow-wrap:anywhere;line-height:1.6;font-size:13px}.message.user{align-self:flex-end;background:#2c2c2c;white-space:pre-wrap}.message.assistant{align-self:flex-start;background:#191919;border:1px solid #292929;white-space:normal}.message.system{align-self:center;color:#f0b9ad;background:#311c18;white-space:pre-wrap}.message.assistant p{margin:0 0 12px}.message.assistant p:last-child{margin-bottom:0}.message.assistant h2,.message.assistant h3,.message.assistant h4{margin:17px 0 8px;line-height:1.25}.message.assistant ul,.message.assistant ol{margin:8px 0 14px;padding-left:24px}.message.assistant li{margin:5px 0}.message.assistant code{padding:2px 5px;border-radius:5px;background:#2b2b2b;color:#f0b28f;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.message.assistant pre{overflow:auto;padding:13px;border:1px solid #353535;border-radius:9px;background:#101010}.message.assistant pre code{padding:0;background:transparent;color:#dedede}.message.assistant a{color:#78aef2}.files{margin-top:8px;color:#aaa;font-size:11px}
.progress{font-size:11px;color:#aaa;background:#191919;border-left:2px solid #d6a93b;padding:8px 12px;border-radius:4px}.approval{border:1px solid #8d6439;background:#2c241b;border-radius:10px;padding:12px}.approval pre{white-space:pre-wrap;max-height:140px;overflow:auto;font-size:10px}.approval .actions{display:flex;gap:7px;flex-wrap:wrap}.approval button{border:1px solid #444;background:#1d1d1d;border-radius:8px;padding:8px 10px}.approval .allowAll{background:#d6a93b;color:#17130a;border-color:#d6a93b}
.composer{position:fixed;z-index:20;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));margin:0 auto;max-width:780px;background:transparent}.attachmentTray{display:flex;gap:8px;margin-bottom:8px;overflow:auto}.att{position:relative;flex:0 0 auto;width:62px;height:62px;border-radius:9px;border:1px solid #444;background:#222;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden}.att img{width:100%;height:100%;object-fit:cover}.att .x{position:absolute;right:1px;top:1px;width:20px;height:20px;border-radius:50%;border:0;background:#111c;padding:0}.slashMenu{position:absolute;left:0;right:0;bottom:100%;max-height:42vh;overflow:auto;padding:6px;border:1px solid #3a3a3a;border-radius:12px;background:#1b1b1b;box-shadow:0 12px 30px #000a}.slashMenu button{width:100%;display:flex;gap:10px;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent}.slashMenu strong{color:#e0b84f}.slashMenu span{color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promptShell{position:relative}.promptShell textarea{width:100%;min-height:76px;max-height:150px;resize:none;border:1px solid #353535;border-radius:13px;background:#1a1a1a;color:#eee;padding:14px 52px 14px 14px;outline:none;font-size:14px}.sendInside{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:12px;border:0;background:#d6a93b;color:#17130a;display:grid;place-items:center}.sendInside svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composeFoot{display:flex;align-items:center;justify-content:space-between;padding:7px 4px 0;gap:8px}.composerTools{display:flex;align-items:center;gap:7px;min-width:0}.iconButton{width:30px;height:30px;border-radius:50%;border:1px solid #3a3a3a;background:#202020;color:#ddd;display:grid;place-items:center;padding:0}.micControl{display:inline-flex;align-items:center;height:30px;border:1px solid #3a3a3a;border-radius:15px;background:#202020}.micControl .micButton{border:0;border-radius:15px;width:36px;height:28px}.micButton svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.runStatus{font-size:10px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}.footerActions{display:flex;align-items:center;gap:5px}.footerControl{border:0;background:transparent;color:#d8d8d8;padding:5px 7px;font-size:10px}.footerControl span:last-child{color:#8c8c8c;margin-left:3px}.stop{border:1px solid #633;background:#1d1d1d;color:#f0b9ad;border-radius:8px;padding:6px 9px;font-size:10px}.hidden{display:none!important}
dialog{width:min(92vw,680px);border:1px solid #333;border-radius:14px;background:#181818;color:#eee;padding:18px}dialog::backdrop{background:#000b}dialog label{display:block;font-size:11px;color:#aaa;margin:10px 0 4px}dialog input,dialog select{width:100%;border:1px solid #343434;background:#111;color:#eee;border-radius:8px;padding:11px}.dialogActions{display:flex;gap:8px;margin-top:14px}.dialogActions button{flex:1;border:1px solid #343434;background:#1d1d1d;border-radius:8px;padding:10px}.preview img{max-width:100%;max-height:75vh;display:block;margin:auto}.preview .close{float:right}
.agentsPanel{position:fixed;inset:0;z-index:80;background:#121212;display:flex;flex-direction:column}.agentsPanel.hidden{display:none}.agentsHead{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #2c2c2c}.agentsHead>div{display:flex;flex-direction:column}.agentsHead small{font-size:10px;color:#777}.agentsBody{display:grid;grid-template-columns:42% 58%;min-height:0;flex:1}.agentsList{overflow:auto;border-right:1px solid #2c2c2c;padding:7px}.agentRow{width:100%;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:left;padding:10px;display:flex;gap:8px}.agentRow.active{background:#24202a}.agentDot{width:8px;height:8px;border-radius:50%;margin-top:4px;background:#9c9c9c;flex:0 0 8px}.agentDot.running,.agentDot.pending{background:#b386df}.agentDot.completed{background:#56c982}.agentDot.failed,.agentDot.killed{background:#d85c66}.agentCopy{min-width:0;display:flex;flex-direction:column;gap:3px}.agentCopy strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agentCopy small{font-size:9px;color:#8a8a8a}.agentDetail{overflow:auto;padding:12px}.agentDetail h3{font-size:14px;margin:0 0 8px}.agentBadge{display:inline-block;font-size:9px;padding:3px 6px;border-radius:10px;background:#342a3d;color:#d8c2ec;margin-bottom:10px}.agentPrompt,.agentEvent{border:1px solid #303030;border-radius:9px;background:#191919;padding:9px;margin-bottom:8px}.agentPrompt small,.agentEvent small{display:block;color:#777;font-size:9px;margin-bottom:5px}.agentPrompt div,.agentEvent div{font-size:11px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.agentEvent.assistant{background:#1d1a20}.agentsEmpty{color:#777;font-size:11px;padding:14px}@media(max-width:500px){.agentsBody{grid-template-columns:38% 62%}}
@media(min-width:760px){.sidebar{position:static;transform:none;width:280px}.scrim,.menuBtn{display:none!important}.titleRow h1{max-width:40vw}.chat{padding-left:max(22px,calc((100% - 820px)/2));padding-right:max(22px,calc((100% - 820px)/2))}}
</style>
</head>
<body>
<div class="layout">
<div id="scrim" class="scrim"></div>
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="logo"><img src="file:///android_res/drawable/noctan_mark.png" alt=""></div><div><strong>NOCTAN</strong><small>WORKSPACE DE IA</small></div></div>
  <input id="sessionSearch" class="search" placeholder="Procurar">
  <button id="newChat" class="newButton">+ Novo</button>
  <div class="section">RECENTES</div>
  <div id="sessions" class="sessions"></div>
  <div class="sidebarbottom"><div class="profileDot">N</div><div class="profileCopy"><strong>Noctan</strong><small>assistente local</small></div><div id="connection" class="connection">• Verificando conexão...</div></div>
</aside>
<section class="main">
<div id="pullRefresh" class="pullRefresh"><img src="file:///android_res/drawable/noctan_mark.png" alt=""><span>Solte para atualizar</span></div>
<header>
  <div class="headerLeft"><button id="menuBtn" class="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="titles"><div class="titleRow"><h1 id="conversationTitle">Novo chat</h1><button id="agentsBtn" class="agentsBtn hidden">Agents <span id="agentsCount">0</span></button></div><span id="workspaceLabel" class="workspace">Noctan remoto</span></div></div>
  <div class="headerRight"><button id="pcControllerBtn" class="ghost pcControllerButton"><span>PC</span><i></i></button><button id="settingsBtn" class="ghost" aria-label="Configurações">&#9881;</button></div>
</header>
<main id="chat" class="chat"><div class="welcome"><img src="file:///android_res/drawable/noctan_mark.png" alt=""><h2>Seu trabalho continua aqui.</h2><p>Mesmo Noctan, agora no celular.</p></div></main>
<div class="composer">
  <div id="attachmentTray" class="attachmentTray"></div>
  <div id="slashMenu" class="slashMenu hidden"></div>
  <div class="promptShell"><textarea id="prompt" rows="2" placeholder="Peça sua tarefa ao Noctan..."></textarea><button id="sendBtn" class="sendInside" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button></div>
  <input id="fileInput" type="file" multiple hidden>
  <div class="composeFoot">
    <div class="composerTools"><button id="attachBtn" class="iconButton">+</button><div class="micControl"><button id="voiceBtn" class="iconButton micButton"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8"/></svg></button></div><span id="runStatus" class="runStatus">Aguardando mensagem</span></div>
    <div class="footerActions"><button id="modelBtn" class="footerControl"><span id="modelLabel">Opus 5.5</span><span id="effortLabel">Médio</span></button><button id="stopBtn" class="stop hidden">Parar</button></div>
  </div>
</div>
</section>
</div>

<section id="agentsPanel" class="agentsPanel hidden"><div class="agentsHead"><div><strong>Agents</strong><small>subagents desta conversa</small></div><button id="closeAgents" class="ghost">Fechar</button></div><div class="agentsBody"><div id="agentsList" class="agentsList"></div><div id="agentDetail" class="agentDetail"><div class="agentsEmpty">Selecione um agent.</div></div></div></section>
<dialog id="settingsDialog"><h3>Conectar ao PC</h3><label>Endereço do Noctan</label><input id="baseInput" autocapitalize="off" spellcheck="false"><label>Token de pairing</label><input id="tokenInput" autocapitalize="off" spellcheck="false"><div class="dialogActions"><button id="closeSettings">Cancelar</button><button id="saveSettings">Salvar</button></div></dialog>
<dialog id="modelDialog"><h3>Modelo</h3><label>Modelo</label><select id="modelSelect"><option value="opus">Opus 5.5</option><option value="fable">Fable 5.1</option><option value="sonnet">Sonnet 5.5</option><option value="haiku">Haiku 5.5</option></select><label>Esforço</label><select id="effortSelect"><option value="low">Baixo</option><option value="medium">Médio</option><option value="high">Alto</option></select><div class="dialogActions"><button id="closeModel">Fechar</button><button id="saveModel">Aplicar</button></div></dialog>
<dialog id="previewDialog" class="preview"><button id="closePreview" class="close">×</button><img id="previewImage" alt="Prévia"></dialog>

<script>
const DEFAULT_BASE=(window.NoctanNative&&window.NoctanNative.getDefaultBase)?window.NoctanNative.getDefaultBase():"";
const DEFAULT_TOKEN=(window.NoctanNative&&window.NoctanNative.getDefaultToken)?window.NoctanNative.getDefaultToken():"";
const state={base:localStorage.getItem("base")||DEFAULT_BASE,token:localStorage.getItem("token")||DEFAULT_TOKEN,current:null,session:null,sessions:[],config:null,pending:[],streaming:false,assistant:null,progress:null,agents:[],selectedAgentId:null,slashCommands:[{name:"compact",description:"Compactar contexto"},{name:"context",description:"Ver contexto"},{name:"cost",description:"Ver custo"},{name:"init",description:"Criar instruções"},{name:"review",description:"Revisar alterações"}]};
const $=id=>document.getElementById(id);
function authHeaders(extra={}){return {Authorization:"Bearer "+state.token,...extra}}
async function api(path,opt={}){const res=await fetch(state.base+path,{...opt,headers:authHeaders({"content-type":"application/json",...(opt.headers||{})})});if(!res.ok){let j={};try{j=await res.json()}catch{}throw Error(j.error||("HTTP "+res.status))}return res}
function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("\"","&quot;").replaceAll("\'","&#39;")}
function inlineMarkdown(value){let s=escapeHtml(value);s=s.replace(new RegExp("`([^`]+)`","g"),"<code>$1</code>");s=s.replace(new RegExp("\\*\\*([^*]+)\\*\\*","g"),"<strong>$1</strong>");return s}
function renderMarkdown(element,text){const lines=String(text??"").split(String.fromCharCode(10));let out=[],inCode=false,code=[];for(const raw of lines){const line=raw.endsWith(String.fromCharCode(13))?raw.slice(0,-1):raw;if(line.trim().startsWith("```")){if(inCode){out.push("<pre><code>"+escapeHtml(code.join(String.fromCharCode(10)))+"</code></pre>");code=[];inCode=false}else inCode=true;continue}if(inCode){code.push(line);continue}if(line.startsWith("### "))out.push("<h4>"+inlineMarkdown(line.slice(4))+"</h4>");else if(line.startsWith("## "))out.push("<h3>"+inlineMarkdown(line.slice(3))+"</h3>");else if(line.startsWith("# "))out.push("<h2>"+inlineMarkdown(line.slice(2))+"</h2>");else if(line.startsWith("- "))out.push("<p>• "+inlineMarkdown(line.slice(2))+"</p>");else if(!line.trim())out.push("<br>");else out.push("<p>"+inlineMarkdown(line)+"</p>")}if(code.length)out.push("<pre><code>"+escapeHtml(code.join(String.fromCharCode(10)))+"</code></pre>");element.innerHTML=out.join("")}
function addMsg(role,text,attachments=[]){const el=document.createElement("div");el.className="message "+role;el.rawText=text||"";if(role==="assistant")renderMarkdown(el,el.rawText);else el.textContent=el.rawText;if(attachments?.length){const f=document.createElement("div");f.className="files";f.textContent="📎 "+attachments.join(", ");el.append(f)}$("chat").append(el);$("chat").scrollTop=$("chat").scrollHeight;return el}function setStatus(ok,text,connecting=false){$("connection").textContent="• "+text;const button=$("pcControllerBtn");button.classList.toggle("connected",ok);button.classList.toggle("connecting",connecting);button.style.opacity=ok||connecting?"1":".72"}
function openSidebar(){ $("sidebar").classList.add("open"); $("scrim").classList.add("show") }
function setSlashCommands(commands){if(!Array.isArray(commands)||!commands.length)return;const unique=new Map;for(const item of commands){const command=typeof item==="string"?{name:item}:item,name=String(command.name||"").replace(/^\//,"").trim();if(name)unique.set(name,{name,description:String(command.description||"")})}if(unique.size)state.slashCommands=[...unique.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function renderSlashMenu(){const value=$("prompt").value,menu=$("slashMenu");if(!value.startsWith("/")||/\s/.test(value)){menu.classList.add("hidden");return}const q=value.slice(1).toLowerCase(),commands=state.slashCommands.filter(x=>x.name.toLowerCase().includes(q)).slice(0,10);menu.replaceChildren();for(const command of commands){const button=document.createElement("button");button.type="button";button.innerHTML="<strong>/"+escapeHtml(command.name)+"</strong><span>"+escapeHtml(command.description||"Comando do Claude")+"</span>";button.onclick=()=>{$("prompt").value="/"+command.name+" ";menu.classList.add("hidden");$("prompt").focus()};menu.append(button)}menu.classList.toggle("hidden",!commands.length)}
function closeSidebar(){ $("sidebar").classList.remove("open"); $("scrim").classList.remove("show") }
function agentStatus(status){return ({running:"Rodando",pending:"Pendente",completed:"Concluído",failed:"Falhou",killed:"Parado",paused:"Pausado"})[status]||status||"Rodando"}
function setAgents(agents){state.agents=Array.isArray(agents)?agents:[];$("agentsCount").textContent=String(state.agents.length);$("agentsBtn").classList.toggle("hidden",!state.agents.length);if(state.selectedAgentId&&!state.agents.some(x=>x.id===state.selectedAgentId))state.selectedAgentId=null;renderAgents()}
function upsertAgent(agent){if(!agent?.id)return;const i=state.agents.findIndex(x=>x.id===agent.id);if(i<0)state.agents.push(agent);else state.agents[i]=agent;$("agentsCount").textContent=String(state.agents.length);$("agentsBtn").classList.remove("hidden");renderAgents()}
function renderAgents(){const list=$("agentsList");if(!list)return;list.replaceChildren();if(!state.agents.length){list.innerHTML='<div class="agentsEmpty">Nenhum subagent nesta conversa.</div>';return}for(const a of state.agents){const b=document.createElement("button");b.className="agentRow"+(a.id===state.selectedAgentId?" active":"");b.innerHTML='<i class="agentDot '+escapeHtml(a.status||"running")+'"></i><span class="agentCopy"><strong>'+escapeHtml(a.description||a.subagentType||"Agent")+'</strong><small>'+escapeHtml(agentStatus(a.status)+(a.lastToolName?" · "+a.lastToolName:""))+'</small></span>';b.onclick=()=>{state.selectedAgentId=a.id;renderAgents();renderAgentDetail(a.id)};list.append(b)}if(state.selectedAgentId)renderAgentDetail(state.selectedAgentId)}
function renderAgentDetail(id){const d=$("agentDetail"),a=state.agents.find(x=>x.id===id);if(!d||!a)return;d.replaceChildren();const title=document.createElement("h3");title.textContent=a.description||"Agent";d.append(title);const badge=document.createElement("span");badge.className="agentBadge";badge.textContent=agentStatus(a.status);d.append(badge);if(a.prompt){const p=document.createElement("div");p.className="agentPrompt";p.innerHTML="<small>Tarefa</small><div></div>";p.querySelector("div").textContent=a.prompt;d.append(p)}for(const e of a.events||[]){const row=document.createElement("div");row.className="agentEvent "+String(e.kind||"");const meta=document.createElement("small");meta.textContent=(e.kind==="assistant"?"Agent":e.kind==="tool"?"Ferramenta":"Status")+" · "+new Date(e.at||Date.now()).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});const body=document.createElement("div");body.textContent=e.text||"";row.append(meta,body);d.append(row)}}
function openAgents(){if(!state.agents.length)return;$("agentsPanel").classList.remove("hidden");if(!state.selectedAgentId&&state.agents[0])state.selectedAgentId=state.agents[0].id;renderAgents();if(state.selectedAgentId)renderAgentDetail(state.selectedAgentId)}
function closeAgents(){$("agentsPanel").classList.add("hidden")}
function renderSessions(){const q=$("sessionSearch").value.trim().toLowerCase();$("sessions").replaceChildren();for(const s of state.sessions.filter(x=>!q||String(x.title||"").toLowerCase().includes(q))){const b=document.createElement("button");b.className="sessionRow"+(s.id===state.current?" active":"");b.innerHTML=(s.inFlight?'<span class="runDot">●</span>':"")+escapeHtml(s.title||"Conversa");b.onclick=()=>openSession(s.id);$("sessions").append(b)}}
async function openSession(id){state.current=id;const s=await (await api("/api/sessions/"+encodeURIComponent(id))).json();renderSession(s);renderSessions();closeSidebar()}
function renderSession(s){state.session=s;state.current=s?.id||state.current;setSlashCommands(s?.slashCommands);setAgents(s?.agents||[]);$("conversationTitle").textContent=s?.title||"Novo chat";$("chat").replaceChildren();state.assistant=null;state.progress=null;if(!s?.messages?.length){$("chat").innerHTML='<div class="welcome"><img src="file:///android_res/drawable/noctan_mark.png"><h2>Seu trabalho continua aqui.</h2><p>Mesmo Noctan, agora no celular.</p></div>'}else for(const m of s.messages)addMsg(m.role,m.text,m.attachments||[]);const active=!!s?.inFlight;$("stopBtn").classList.toggle("hidden",!active);$("runStatus").textContent=active?"Agente em execução":"Aguardando mensagem";$("chat").scrollTop=$("chat").scrollHeight}
async function loadSessions(keep=true){state.sessions=await (await api("/api/sessions-summary")).json();const prev=state.current;if(keep&&prev&&state.sessions.some(x=>x.id===prev))state.current=prev;else if(!state.current&&state.sessions.length)state.current=state.sessions[0].id;renderSessions();if(state.current)await openSession(state.current);else renderSession({id:null,messages:[]})}
function modelName(v){return ({opus:"Opus 5.5",fable:"Fable 5.1",sonnet:"Sonnet 5.5",haiku:"Haiku 5.5"}[v]||v)}
function effortName(v){return ({low:"Baixo",medium:"Médio",high:"Alto"}[v]||v)}
async function refreshStatus(){try{const st=await (await api("/api/status")).json();state.config=st.config;const model=st.config.anthropicModel||st.config.model||"opus",effort=st.config.effort||"medium";$("modelSelect").value=model;$("effortSelect").value=effort;$("modelLabel").textContent=modelName(model);$("effortLabel").textContent=effortName(effort);const pc=st.discovery?.pcController;setStatus(true,pc?.localConnected?"PC Controller conectado · "+(pc.localToolCount||0)+" ferramentas":"Noctan conectado")}catch(e){setStatus(false,"Reconectando…")}}
async function saveConfig(){if(!state.config)return;state.config={...state.config,anthropicModel:$("modelSelect").value,model:$("modelSelect").value,effort:$("effortSelect").value};await api("/api/config",{method:"PUT",body:JSON.stringify(state.config)});$("modelLabel").textContent=modelName($("modelSelect").value);$("effortLabel").textContent=effortName($("effortSelect").value)}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,dataUrl:r.result});r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function addFiles(files){for(const f of [...files].slice(0,5-state.pending.length)){if(f.size>20000000){addMsg("system",f.name+" é maior que 20 MB");continue}state.pending.push(await fileToDataUrl(f))}renderPending()}
function renderPending(){$("attachmentTray").replaceChildren();state.pending.forEach((a,i)=>{const d=document.createElement("div");d.className="att";if(a.type.startsWith("image/")){const img=document.createElement("img");img.src=a.dataUrl;img.onclick=()=>{$("previewImage").src=a.dataUrl;$("previewDialog").showModal()};d.append(img)}else d.textContent=(a.name.split(".").pop()||"FILE").toUpperCase();const x=document.createElement("button");x.className="x";x.textContent="×";x.onclick=e=>{e.stopPropagation();state.pending.splice(i,1);renderPending()};d.append(x);$("attachmentTray").append(d)})}
function approvalCard(data){const d=document.createElement("div");d.className="approval";d.innerHTML="<b>Permissão solicitada: "+escapeHtml(data.tool)+"</b><pre>"+escapeHtml(JSON.stringify(data.input,null,2))+"</pre><div class=actions></div>";for(const [label,allow,all,bypass] of [["Permitir",true,false,false],["Permitir tudo",true,true,false],["Bypass all permissions",true,true,true],["Negar",false,false,false]]){const b=document.createElement("button");b.textContent=label;if(all)b.className="allowAll";b.onclick=async()=>{await api("/api/approve",{method:"POST",body:JSON.stringify({id:data.id,allow,allowAll:all,bypassAll:bypass})});d.remove()};d.querySelector(".actions").append(b)}$("chat").append(d);$("chat").scrollTop=$("chat").scrollHeight}
function progress(text){if(!state.progress||!state.progress.isConnected){state.progress=document.createElement("div");state.progress.className="progress";$("chat").append(state.progress)}state.progress.textContent=text;$("runStatus").textContent=text;$("chat").scrollTop=$("chat").scrollHeight}
function parsePacket(packet){let event="",data="";for(const raw of packet.split(String.fromCharCode(10))){const line=raw.trim();if(line.startsWith("event:"))event=line.slice(6).trim();else if(line.startsWith("data:"))data+=line.slice(5).trim()}if(!event)return;let obj={};try{obj=JSON.parse(data||"{}")}catch{}if(event==="agent"){upsertAgent(obj.agent);return}if(event==="start"){state.current=obj.sessionId;state.streaming=true;$("stopBtn").classList.remove("hidden");progress("Agente em execução")}else if(event==="commands"||event==="init"){setSlashCommands(obj.commands);renderSlashMenu()}else if(event==="text"){if(!state.assistant)state.assistant=addMsg("assistant","");state.assistant.rawText+=(state.assistant.rawText?String.fromCharCode(10):"")+String(obj.text||"");renderMarkdown(state.assistant,state.assistant.rawText);$("chat").scrollTop=$("chat").scrollHeight}else if(event==="tool")progress("Usando ferramenta: "+obj.name);else if(event==="approval"){approvalCard(obj);progress("Aguardando autorização")}else if(event==="notice")progress(obj.text||"Atualização");else if(event==="error")addMsg("system","Erro: "+(obj.error||"desconhecido"));else if(event==="done"){state.streaming=false;$("stopBtn").classList.add("hidden");state.progress?.remove();state.progress=null;state.assistant=null;$("runStatus").textContent="Aguardando mensagem";loadSessions(true).catch(()=>{})}}
async function streamRun(body){
  state.streaming=true;
  state.assistant=null;
  progress("Iniciando...");
  try{
    const res=await fetch(state.base+"/api/run",{
      method:"POST",
      headers:authHeaders({"content-type":"application/json"}),
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const j=await res.json().catch(()=>({}));
      const error=Error(j.error||("Falha ao iniciar ("+res.status+")"));
      error.status=res.status;
      throw error;
    }
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf="";
    while(true){
      const part=await reader.read();
      if(part.done)break;
      buf+=dec.decode(part.value,{stream:true}).replace(/\r\n/g,"\n");
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        parsePacket(buf.slice(0,i));
        buf=buf.slice(i+2);
      }
    }
  }finally{
    state.streaming=false;
    state.assistant=null;
    $("stopBtn").classList.add("hidden");
    if(state.current)loadSessions(true).catch(()=>{});
  }
}
async function sendFollowUp(prompt,attachments){
  await api("/api/follow-up",{
    method:"POST",
    body:JSON.stringify({sessionId:state.current,prompt,attachments})
  });
  progress(attachments.length?"Follow-up com anexo enviado":"Follow-up enviado");
}
async function send(){
  const prompt=$("prompt").value.trim(),attachments=[...state.pending];
  if(!prompt&&!attachments.length)return;
  $("prompt").value="";
  state.pending=[];
  renderPending();
  addMsg("user",prompt||"Arquivo anexado",attachments.map(x=>x.name));
  state.assistant=null;

  const summary=state.sessions.find(x=>x.id===state.current);
  const active=state.streaming||!!summary?.liveActive||!!state.session?.liveActive;
  if(active&&state.current){
    await sendFollowUp(prompt,attachments);
    return;
  }

  try{
    await streamRun({prompt,sessionId:state.current||null,provider:"anthropic",attachments});
  }catch(error){
    if(error?.status===409&&state.current&&/existe execu/i.test(String(error.message||""))){
      await sendFollowUp(prompt,attachments);
      return;
    }
    throw error;
  }
}
$("menuBtn").onclick=openSidebar;$("agentsBtn").onclick=openAgents;$("closeAgents").onclick=closeAgents;$("scrim").onclick=closeSidebar;$("sessionSearch").oninput=renderSessions;$("newChat").onclick=()=>{state.current=null;renderSession({id:null,messages:[]});renderSessions();closeSidebar()};
$("sendBtn").onclick=()=>send().catch(e=>addMsg("system",e.message));$("prompt").addEventListener("input",renderSlashMenu);$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send().catch(x=>addMsg("system",x.message))}});
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{addFiles(e.target.files).catch(x=>addMsg("system",x.message));e.target.value=""};$("voiceBtn").onclick=()=>{if(window.NoctanNative)window.NoctanNative.startVoice()};window.NoctanVoiceResult=text=>{const p=$("prompt");p.value=(p.value+" "+text).trim();p.focus()};window.NoctanVoiceError=msg=>addMsg("system",msg);
$("stopBtn").onclick=async()=>{if(!state.current)return;await api("/api/cancel",{method:"POST",body:JSON.stringify({sessionId:state.current})});progress("Parando…")};
$("settingsBtn").onclick=()=>{$("baseInput").value=state.base;$("tokenInput").value=state.token;$("settingsDialog").showModal()};$("closeSettings").onclick=()=>$("settingsDialog").close();$("saveSettings").onclick=()=>{state.base=$("baseInput").value.trim().replace(/\/$/,"");state.token=$("tokenInput").value.trim();localStorage.setItem("base",state.base);localStorage.setItem("token",state.token);$("settingsDialog").close();boot()};
$("modelBtn").onclick=()=>$("modelDialog").showModal();$("closeModel").onclick=()=>$("modelDialog").close();$("saveModel").onclick=async()=>{await saveConfig();$("modelDialog").close()};
$("closePreview").onclick=()=>$("previewDialog").close();$("previewDialog").onclick=e=>{if(e.target===$("previewDialog"))$("previewDialog").close()};
async function tryDefaultConnection(){if(!DEFAULT_BASE||DEFAULT_BASE===state.base)return false;const previousBase=state.base,previousToken=state.token;state.base=DEFAULT_BASE.replace(/\/$/,"");state.token=DEFAULT_TOKEN;try{await refreshStatus();localStorage.setItem("base",state.base);localStorage.setItem("token",state.token);return true}catch{state.base=previousBase;state.token=previousToken;return false}}
async function boot(){setStatus(false,"Conectando…");try{await refreshStatus();await loadSessions(false)}catch(e){if(await tryDefaultConnection()){await loadSessions(false);return}setStatus(false,"PC não encontrado");$("chat").innerHTML='<div class="welcome"><img src="file:///android_res/drawable/noctan_mark.png"><h2>PC não encontrado</h2><p>Puxe para baixo para tentar novamente ou abra ⚙ se o endereço do PC mudou.</p></div>'}}
async function resyncAfterResume(){state.streaming=false;state.assistant=null;setStatus(false,"Procurando o PC…",true);try{await refreshStatus();await loadSessions(true);return true}catch(e){if(await tryDefaultConnection()){await loadSessions(true);return true}setStatus(false,"PC não encontrado");return false}}
let pullStart=0,pullActive=false,pullBusy=false;const pull=$("pullRefresh"),chat=$("chat");
chat.addEventListener("touchstart",e=>{if(chat.scrollTop<=0&&!pullBusy){pullStart=e.touches[0].clientY;pullActive=true}},{passive:true});
chat.addEventListener("touchmove",e=>{if(!pullActive)return;const distance=e.touches[0].clientY-pullStart;if(distance>24)pull.classList.add("show");pull.querySelector("span").textContent=distance>78?"Solte para atualizar":"Puxe para atualizar"},{passive:true});
chat.addEventListener("touchend",async e=>{if(!pullActive)return;const distance=(e.changedTouches[0]?.clientY||pullStart)-pullStart;pullActive=false;if(distance<=78){pull.classList.remove("show");return}pullBusy=true;pull.classList.add("show","loading");pull.querySelector("span").textContent="Procurando o PC…";const connected=await resyncAfterResume();pullBusy=false;pull.classList.remove("loading");pull.querySelector("span").textContent=connected?"PC conectado":"PC não encontrado";setTimeout(()=>pull.classList.remove("show"),850)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")resyncAfterResume()});window.addEventListener("pageshow",()=>resyncAfterResume());window.addEventListener("online",()=>resyncAfterResume());window.NoctanAppResumed=()=>resyncAfterResume();
window.NoctanHandleBack=()=>{if(!$("agentsPanel").classList.contains("hidden")){closeAgents();return true}if($("sidebar").classList.contains("open")){closeSidebar();return true}if($("settingsDialog").open){$("settingsDialog").close();return true}if($("modelDialog").open){$("modelDialog").close();return true}return false};
boot();setInterval(async()=>{try{await refreshStatus();if(!state.streaming&&state.current)await loadSessions(true)}catch(e){setStatus(false,"Reconectando…")}},3000);
</script>
